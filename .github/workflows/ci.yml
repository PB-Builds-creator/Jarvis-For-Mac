name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} contracts
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install build==1.3.0 numpy==2.5.1 misaki==0.7.4 setuptools==83.0.0 wheel==0.47.0
      - name: Build Python package
        run: python -m build --wheel --no-isolation
      - name: Verify source and policy contracts
        run: ./scripts/verify.sh
